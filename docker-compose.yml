services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: aza_trazabilidad
      MARIADB_USER: aza_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD en .env}
    volumes: [mariadb_data:/var/lib/mysql]
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 5s, retries: 20}
  mongo:
    image: mongo:7.0
    volumes: [mongo_data:/data/db]
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"], interval: 5s, retries: 20}
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: mariadb
      MONGO_URI: mongodb://mongo:27017
    depends_on: {mariadb: {condition: service_healthy}, mongo: {condition: service_healthy}}
    ports: ["8000:8000"]
volumes: {mariadb_data: {}, mongo_data: {}}
